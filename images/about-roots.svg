<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2D6A4F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16342A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#C6A15B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E4CE9E;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)" rx="20"/>
  <!-- Root system -->
  <g stroke="url(#gold)" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M200 80 L200 160 Q200 200 180 240 Q160 280 120 320"/>
    <path d="M200 160 Q220 200 240 240 Q260 280 280 300"/>
    <path d="M200 180 Q170 210 140 230"/>
    <path d="M200 200 Q230 230 260 250"/>
    <path d="M200 220 Q160 250 100 280"/>
    <path d="M200 240 Q240 270 300 290"/>
    <path d="M180 240 Q150 270 110 300 Q90 320 70 340"/>
    <path d="M240 240 Q270 270 310 300 Q330 320 340 350"/>
  </g>
  <!-- Trichoderma spores -->
  <g fill="#E4CE9E">
    <circle cx="170" cy="220" r="4" opacity="0.8"/>
    <circle cx="230" cy="210" r="3" opacity="0.7"/>
    <circle cx="150" cy="260" r="3.5" opacity="0.75"/>
    <circle cx="260" cy="250" r="4" opacity="0.8"/>
    <circle cx="130" cy="300" r="3" opacity="0.6"/>
    <circle cx="280" cy="280" r="3.5" opacity="0.7"/>
    <circle cx="110" cy="330" r="2.5" opacity="0.5"/>
    <circle cx="310" cy="310" r="3" opacity="0.6"/>
  </g>
  <!-- Plant top -->
  <g fill="#6FA37E">
    <ellipse cx="200" cy="70" rx="30" ry="20"/>
    <ellipse cx="170" cy="85" rx="22" ry="15" transform="rotate(-20 170 85)"/>
    <ellipse cx="230" cy="85" rx="22" ry="15" transform="rotate(20 230 85)"/>
  </g>
  <!-- Label -->
  <text x="200" y="380" text-anchor="middle" fill="#E4CE9E" font-family="serif" font-size="14" font-style="italic">Trichoderma Root Protection</text>
</svg>