<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0F4FF;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#sky)"/>
  <!-- Ground -->
  <rect x="0" y="200" width="400" height="100" fill="#8B7355"/>
  <rect x="0" y="200" width="400" height="20" fill="#6B8E23"/>
  <!-- Plants -->
  <g fill="#228B22">
    <rect x="50" y="140" width="8" height="60" fill="#8B4513"/>
    <ellipse cx="54" cy="130" rx="25" ry="30"/>
    <rect x="120" y="120" width="8" height="80" fill="#8B4513"/>
    <ellipse cx="124" cy="105" rx="30" ry="35"/>
    <rect x="200" y="130" width="8" height="70" fill="#8B4513"/>
    <ellipse cx="204" cy="115" rx="28" ry="32"/>
    <rect x="280" y="135" width="8" height="65" fill="#8B4513"/>
    <ellipse cx="284" cy="120" rx="26" ry="30"/>
    <rect x="340" y="145" width="8" height="55" fill="#8B4513"/>
    <ellipse cx="344" cy="135" rx="22" ry="25"/>
  </g>
  <!-- Sun -->
  <circle cx="350" cy="50" r="35" fill="#FFD700" opacity="0.8"/>
  <!-- Label -->
  <text x="200" y="280" text-anchor="middle" fill="#2D6A4F" font-family="sans-serif" font-size="12" font-weight="bold">Healthy Crop Field</text>
</svg>