<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#FFF8DC"/>
  <!-- Soil cross section -->
  <rect x="50" y="80" width="300" height="180" fill="#8B4513" rx="10"/>
  <!-- Soil layers -->
  <rect x="50" y="80" width="300" height="40" fill="#A0522D" rx="10"/>
  <rect x="50" y="120" width="300" height="60" fill="#8B4513"/>
  <rect x="50" y="180" width="300" height="80" fill="#654321" rx="0 0 10 10"/>
  <!-- Nutrients dots -->
  <g fill="#FFD700" opacity="0.7">
    <circle cx="100" cy="140" r="4"/>
    <circle cx="150" cy="155" r="3"/>
    <circle cx="200" cy="135" r="5"/>
    <circle cx="250" cy="150" r="3.5"/>
    <circle cx="300" cy="145" r="4"/>
    <circle cx="120" cy="190" r="3"/>
    <circle cx="180" cy="200" r="4"/>
    <circle cx="230" cy="195" r="3.5"/>
    <circle cx="280" cy="205" r="3"/>
  </g>
  <!-- Root network -->
  <g stroke="#DEB887" stroke-width="2" fill="none">
    <path d="M200 80 L200 140 Q180 170 140 200"/>
    <path d="M200 140 Q220 170 260 200"/>
    <path d="M200 160 Q160 180 110 210"/>
    <path d="M200 160 Q240 180 290 210"/>
  </g>
  <!-- Trichoderma glow -->
  <circle cx="200" cy="150" r="40" fill="#228B22" opacity="0.2"/>
  <circle cx="200" cy="150" r="25" fill="#228B22" opacity="0.3"/>
  <text x="200" y="285" text-anchor="middle" fill="#2D6A4F" font-family="sans-serif" font-size="12" font-weight="bold">Enriched Soil</text>
</svg>